<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 茶马古道</title>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/user-center.css">
</head>
<body>
    <!-- 导航栏会通过JavaScript加载 -->
    
    <div class="container">
        <div class="user-profile">
            <div class="user-avatar" id="user-avatar">
                <!-- 用户名首字母 -->
            </div>
            <div class="user-info">
                <h2 id="user-name">用户名</h2>
                <p id="user-email">邮箱</p>
                <p>注册时间: <span id="user-join-date">2026-03-10</span></p>
            </div>
        </div>
        
        <div class="section">
            <h3>我的活动</h3>
            <div id="activity-list">
                <div class="no-data">
                    暂无活动记录
                </div>
            </div>
        </div>
        
        <div class="section">
            <h3>我的收藏</h3>
            <div id="favorites-list">
                <div class="no-data">
                    暂无收藏内容
                </div>
            </div>
        </div>
        
        <div class="section">
            <h3>账户设置</h3>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="changePassword()">修改密码</button>
                <button class="btn btn-danger" onclick="deleteAccount()">删除账户</button>
            </div>
        </div>
    </div>
    
    <!-- 修改密码模态框 -->
    <div id="password-modal">
        <div>
            <h3>修改密码</h3>
            <form id="password-form">
                <div>
                    <label for="current-password">当前密码：</label>
                    <input type="password" id="current-password" name="currentPassword" required>
                </div>
                <div>
                    <label for="new-password">新密码：</label>
                    <input type="password" id="new-password" name="newPassword" required>
                </div>
                <div>
                    <label for="confirm-password">确认新密码：</label>
                    <input type="password" id="confirm-password" name="confirmPassword" required>
                </div>
                <div id="password-error"></div>
                <div>
                    <button type="submit" class="btn">保存</button>
                    <button type="button" class="btn btn-secondary" onclick="closePasswordModal()">取消</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/navbar.js"></script>
    <script>
        // 页面加载时检查登录状态
        window.addEventListener('load', function() {
            checkUserStatus();
            // 加载用户活动和收藏数据
            loadUserActivities();
            loadUserFavorites();
        });
        
        // 检查登录状态
        function checkUserStatus() {
            const userStr = localStorage.getItem('user');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    updateUserProfile(user);
                } catch (error) {
                    console.error('解析用户信息失败:', error);
                    // 解析失败，不显示警告，显示默认内容
                    updateUserProfile({ username: '用户', email: 'user@example.com' });
                }
            } else {
                // 未登录，不显示警告，显示默认内容
                updateUserProfile({ username: '用户', email: 'user@example.com' });
            }
        }
        
        // 更新用户资料
        function updateUserProfile(user) {
            // 更新用户名首字母
            const avatar = document.getElementById('user-avatar');
            const userName = document.getElementById('user-name');
            const userEmail = document.getElementById('user-email');
            const userJoinDate = document.getElementById('user-join-date');
            
            if (avatar) {
                avatar.textContent = user.username.charAt(0).toUpperCase();
            }
            
            if (userName) {
                userName.textContent = user.username;
            }
            
            if (userEmail) {
                userEmail.textContent = user.email;
            }
            
            if (userJoinDate) {
                // 从用户ID中提取时间戳
                const timestamp = user.id.split('-')[1];
                if (timestamp) {
                    const date = new Date(parseInt(timestamp));
                    userJoinDate.textContent = date.toISOString().split('T')[0];
                }
            }
        }
        
        // 打开修改密码模态框
        function changePassword() {
            const modal = document.getElementById('password-modal');
            if (modal) {
                modal.style.display = 'flex';
            }
        }
        
        // 关闭修改密码模态框
        function closePasswordModal() {
            const modal = document.getElementById('password-modal');
            if (modal) {
                modal.style.display = 'none';
            }
        }
        
        // 处理修改密码表单提交
        document.getElementById('password-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorElement = document.getElementById('password-error');
            
            // 验证表单数据
            if (!currentPassword || !newPassword || !confirmPassword) {
                errorElement.textContent = '请填写所有必填字段';
                return;
            }
            
            if (newPassword.length < 6) {
                errorElement.textContent = '新密码长度至少为6位';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                errorElement.textContent = '两次输入的密码不一致';
                return;
            }
            
            // 获取当前用户信息
            const userStr = localStorage.getItem('user');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    
                    // 验证当前密码（这里只是模拟，实际应该通过API验证）
                    if (user.password !== currentPassword) {
                        errorElement.textContent = '当前密码错误';
                        return;
                    }
                    
                    // 更新密码（这里只是模拟，实际应该通过API更新）
                    user.password = newPassword;
                    localStorage.setItem('user', JSON.stringify(user));
                    
                    // 显示成功消息
                    alert('密码修改成功！');
                    closePasswordModal();
                } catch (error) {
                    console.error('修改密码错误:', error);
                    errorElement.textContent = '修改密码失败，请稍后重试';
                }
            }
        });
        
        // 删除账户
        function deleteAccount() {
            if (confirm('确定要删除您的账户吗？此操作不可恢复。')) {
                // 清除用户信息
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                
                // 跳转到登录页面
                window.location.href = 'route.html';
            }
        }
        
        // 加载用户活动数据
        function loadUserActivities() {
            const activityList = document.getElementById('activity-list');
            if (!activityList) return;
            
            // 模拟活动数据
            const activities = [
                {
                    id: 1,
                    title: '查看唐朝茶马古道',
                    description: '浏览了唐朝时期的茶马古道地图和相关历史信息',
                    time: '2026-03-10 10:30'
                },
                {
                    id: 2,
                    title: '学习历史人物',
                    description: '查看了文成公主和松赞干布的历史资料',
                    time: '2026-03-09 14:20'
                },
                {
                    id: 3,
                    title: '探索文化遗产',
                    description: '浏览了布达拉宫等文化遗产的详细信息',
                    time: '2026-03-08 09:15'
                },
                {
                    id: 4,
                    title: '分析时空演变',
                    description: '查看了茶马古道在不同朝代的时空演变',
                    time: '2026-03-07 16:45'
                }
            ];
            
            // 生成活动列表
            if (activities.length > 0) {
                const activitiesHTML = activities.map(activity => `
                    <div class="activity-item">
                        <h4>${activity.title}</h4>
                        <p>${activity.description}</p>
                        <div class="time">${activity.time}</div>
                    </div>
                `).join('');
                activityList.innerHTML = activitiesHTML;
            } else {
                activityList.innerHTML = '<div class="no-data">暂无活动记录</div>';
            }
        }
        
        // 加载用户收藏数据
        function loadUserFavorites() {
            const favoritesList = document.getElementById('favorites-list');
            if (!favoritesList) return;
            
            // 模拟收藏数据
            const favorites = [
                {
                    id: 1,
                    title: '布达拉宫',
                    type: '文化遗产',
                    description: '世界文化遗产，藏传佛教圣地，始建于7世纪松赞干布时期',
                    time: '2026-03-10'
                },
                {
                    id: 2,
                    title: '文成公主',
                    type: '历史人物',
                    description: '唐朝文成公主入藏，促进了汉藏文化交流和茶马贸易的发展',
                    time: '2026-03-09'
                },
                {
                    id: 3,
                    title: '丽江古城',
                    type: '文化遗产',
                    description: '保存了完整的古代城市风貌，是茶马古道上的重要商贸城市',
                    time: '2026-03-08'
                }
            ];
            
            // 生成收藏列表
            if (favorites.length > 0) {
                const favoritesHTML = favorites.map(favorite => `
                    <div class="activity-item">
                        <h4>${favorite.title}</h4>
                        <p><strong>类型：</strong>${favorite.type}</p>
                        <p>${favorite.description}</p>
                        <div class="time">收藏时间：${favorite.time}</div>
                    </div>
                `).join('');
                favoritesList.innerHTML = favoritesHTML;
            } else {
                favoritesList.innerHTML = '<div class="no-data">暂无收藏内容</div>';
            }
        }
    </script>
</body>
</html>
