<!-- 导航栏JavaScript -->
<script>
    // 导航栏切换功能
    function initNavbar() {
        const navbarToggle = document.getElementById('navbar-toggle');
        const navbarLinks = document.querySelector('.navbar-links');
        
        if (navbarToggle && navbarLinks) {
            navbarToggle.addEventListener('click', function() {
                navbarLinks.classList.toggle('active');
            });
        }
        
        // 页面滚动时导航栏样式变化
        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.navbar');
            if (navbar) {
                if (window.scrollY > 50) {
                    navbar.style.boxShadow = '0 4px 12px rgba(139, 69, 19, 0.5)';
                } else {
                    navbar.style.boxShadow = '0 4px 12px rgba(139, 69, 19, 0.3)';
                }
            }
        });
        
        // 登录/注册功能
        
        // 显示登录模态框
        function showLoginModal() {
            // 创建登录容器
            const loginContainer = document.createElement('div');
            loginContainer.id = 'login-container';
            loginContainer.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.7);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
            `;
            
            // 创建登录内容
            const loginContent = document.createElement('div');
            loginContent.style.cssText = `
                background-color: white;
                padding: 40px;
                border-radius: 10px;
                text-align: center;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
                max-width: 400px;
                width: 100%;
                color: #8B4513;
            `;
            
            // 添加标题
            const loginTitle = document.createElement('h3');
            loginTitle.textContent = '用户登录';
            loginTitle.style.marginBottom = '30px';
            loginTitle.style.color = '#8B4513';
            loginContent.appendChild(loginTitle);
            
            // 添加登录表单
            const loginForm = document.createElement('form');
            loginForm.id = 'login-form';
            loginForm.style.cssText = `
                display: flex;
                flex-direction: column;
                gap: 20px;
                color: #8B4513;
            `;
            
            // 添加邮箱输入
            const emailInput = document.createElement('div');
            emailInput.innerHTML = `
                <label for="login-email" style="color: #8B4513;">邮箱：</label>
                <input type="email" id="login-email" name="email" required style="
                    width: 100%;
                    padding: 12px;
                    border: 1px solid #ddd;
                    border-radius: 5px;
                    font-size: 16px;
                    color: #8B4513;
                ">
            `;
            loginForm.appendChild(emailInput);
            
            // 添加密码输入
            const passwordInput = document.createElement('div');
            passwordInput.innerHTML = `
                <label for="login-password" style="color: #8B4513;">密码：</label>
                <input type="password" id="login-password" name="password" required style="
                    width: 100%;
                    padding: 12px;
                    border: 1px solid #ddd;
                    border-radius: 5px;
                    font-size: 16px;
                    color: #8B4513;
                ">
            `;
            loginForm.appendChild(passwordInput);
            
            // 添加错误信息显示
            const errorMessage = document.createElement('div');
            errorMessage.id = 'login-error';
            errorMessage.style.cssText = `
                color: red;
                margin-top: 10px;
                font-size: 14px;
            `;
            loginForm.appendChild(errorMessage);
            
            // 添加提交按钮
            const submitButton = document.createElement('button');
            submitButton.type = 'submit';
            submitButton.textContent = '登录';
            submitButton.style.cssText = `
                padding: 12px;
                background-color: #8B4513;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
                margin-top: 10px;
            `;
            loginForm.appendChild(submitButton);
            
            // 添加注册链接
            const registerLink = document.createElement('div');
            registerLink.innerHTML = `
                <p style="color: #8B4513;">还没有账号？<a href="javascript:void(0)" id="switch-to-register" style="color: #8B4513; text-decoration: underline;">立即注册</a></p>
            `;
            registerLink.style.marginTop = '20px';
            loginForm.appendChild(registerLink);
            
            // 添加关闭按钮
            const closeButton = document.createElement('button');
            closeButton.type = 'button';
            closeButton.textContent = '关闭';
            closeButton.style.cssText = `
                padding: 10px 20px;
                background-color: #666;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 14px;
                margin-top: 10px;
            `;
            closeButton.onclick = function() {
                document.body.removeChild(loginContainer);
            };
            loginForm.appendChild(closeButton);
            
            loginContent.appendChild(loginForm);
            loginContainer.appendChild(loginContent);
            document.body.appendChild(loginContainer);
            
            // 切换到注册模态框
            document.getElementById('switch-to-register').addEventListener('click', function() {
                document.body.removeChild(loginContainer);
                showRegisterModal();
            });
            
            // 处理登录表单提交
            document.getElementById('login-form').addEventListener('submit', function(e) {
                e.preventDefault();
                handleLogin();
            });
        }
        
        // 显示注册模态框
        function showRegisterModal() {
            // 创建注册容器
            const registerContainer = document.createElement('div');
            registerContainer.id = 'register-container';
            registerContainer.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.7);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
            `;
            
            // 创建注册内容
            const registerContent = document.createElement('div');
            registerContent.style.cssText = `
                background-color: white;
                padding: 40px;
                border-radius: 10px;
                text-align: center;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
                max-width: 400px;
                width: 100%;
                color: #8B4513;
            `;
            
            // 添加标题
            const registerTitle = document.createElement('h3');
            registerTitle.textContent = '用户注册';
            registerTitle.style.marginBottom = '30px';
            registerTitle.style.color = '#8B4513';
            registerContent.appendChild(registerTitle);
            
            // 添加注册表单
            const registerForm = document.createElement('form');
            registerForm.id = 'register-form';
            registerForm.style.cssText = `
                display: flex;
                flex-direction: column;
                gap: 20px;
                color: #8B4513;
            `;
            
            // 添加用户名输入
            const usernameInput = document.createElement('div');
            usernameInput.innerHTML = `
                <label for="register-username" style="color: #8B4513;">用户名：</label>
                <input type="text" id="register-username" name="username" required style="
                    width: 100%;
                    padding: 12px;
                    border: 1px solid #ddd;
                    border-radius: 5px;
                    font-size: 16px;
                    color: #8B4513;
                ">
            `;
            registerForm.appendChild(usernameInput);
            
            // 添加邮箱输入
            const emailInput = document.createElement('div');
            emailInput.innerHTML = `
                <label for="register-email" style="color: #8B4513;">邮箱：</label>
                <input type="email" id="register-email" name="email" required style="
                    width: 100%;
                    padding: 12px;
                    border: 1px solid #ddd;
                    border-radius: 5px;
                    font-size: 16px;
                    color: #8B4513;
                ">
            `;
            registerForm.appendChild(emailInput);
            
            // 添加密码输入
            const passwordInput = document.createElement('div');
            passwordInput.innerHTML = `
                <label for="register-password" style="color: #8B4513;">密码：</label>
                <input type="password" id="register-password" name="password" required style="
                    width: 100%;
                    padding: 12px;
                    border: 1px solid #ddd;
                    border-radius: 5px;
                    font-size: 16px;
                    color: #8B4513;
                ">
            `;
            registerForm.appendChild(passwordInput);
            
            // 添加密码确认输入
            const confirmPasswordInput = document.createElement('div');
            confirmPasswordInput.innerHTML = `
                <label for="register-confirm-password" style="color: #8B4513;">确认密码：</label>
                <input type="password" id="register-confirm-password" name="confirmPassword" required style="
                    width: 100%;
                    padding: 12px;
                    border: 1px solid #ddd;
                    border-radius: 5px;
                    font-size: 16px;
                    color: #8B4513;
                ">
            `;
            registerForm.appendChild(confirmPasswordInput);
            
            // 添加错误信息显示
            const errorMessage = document.createElement('div');
            errorMessage.id = 'register-error';
            errorMessage.style.cssText = `
                color: red;
                margin-top: 10px;
                font-size: 14px;
            `;
            registerForm.appendChild(errorMessage);
            
            // 添加提交按钮
            const submitButton = document.createElement('button');
            submitButton.type = 'submit';
            submitButton.textContent = '注册';
            submitButton.style.cssText = `
                padding: 12px;
                background-color: #8B4513;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
                margin-top: 10px;
            `;
            registerForm.appendChild(submitButton);
            
            // 添加登录链接
            const loginLink = document.createElement('div');
            loginLink.innerHTML = `
                <p style="color: #8B4513;">已有账号？<a href="javascript:void(0)" id="switch-to-login" style="color: #8B4513; text-decoration: underline;">立即登录</a></p>
            `;
            loginLink.style.marginTop = '20px';
            registerForm.appendChild(loginLink);
            
            // 添加关闭按钮
            const closeButton = document.createElement('button');
            closeButton.type = 'button';
            closeButton.textContent = '关闭';
            closeButton.style.cssText = `
                padding: 10px 20px;
                background-color: #666;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 14px;
                margin-top: 10px;
            `;
            closeButton.onclick = function() {
                document.body.removeChild(registerContainer);
            };
            registerForm.appendChild(closeButton);
            
            registerContent.appendChild(registerForm);
            registerContainer.appendChild(registerContent);
            document.body.appendChild(registerContainer);
            
            // 切换到登录模态框
            document.getElementById('switch-to-login').addEventListener('click', function() {
                document.body.removeChild(registerContainer);
                showLoginModal();
            });
            
            // 处理注册表单提交
            document.getElementById('register-form').addEventListener('submit', function(e) {
                e.preventDefault();
                handleRegister();
            });
        }
        
        // 处理登录表单提交
        function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorElement = document.getElementById('login-error');
            
            try {
                // 验证表单数据
                if (!email || !password) {
                    errorElement.textContent = '请填写所有必填字段';
                    return;
                }
                
                // 验证邮箱格式
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    errorElement.textContent = '请输入有效的邮箱地址';
                    return;
                }
                
                // 从localStorage获取用户数据
                const users = JSON.parse(localStorage.getItem('users')) || [];
                
                // 查找用户
                const user = users.find(user => user.email === email);
                if (!user) {
                    errorElement.textContent = '邮箱或密码错误';
                    return;
                }
                
                // 验证密码
                if (user.password !== password) {
                    errorElement.textContent = '邮箱或密码错误';
                    return;
                }
                
                // 生成模拟token
                const token = 'mock-token-' + Date.now();
                
                // 登录成功，保存token和用户信息
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(user));
                
                // 更新UI
                updateUserUI(user);
                
                // 关闭登录模态框
                document.body.removeChild(document.getElementById('login-container'));
                
                // 显示成功消息
                alert('登录成功！');
            } catch (error) {
                console.error('登录错误:', error);
                errorElement.textContent = '登录失败，请稍后重试';
            }
        }
        
        // 处理注册表单提交
        function handleRegister() {
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;
            const errorElement = document.getElementById('register-error');
            
            try {
                // 验证表单数据
                if (!username || !email || !password || !confirmPassword) {
                    errorElement.textContent = '请填写所有必填字段';
                    return;
                }
                
                // 验证邮箱格式
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    errorElement.textContent = '请输入有效的邮箱地址';
                    return;
                }
                
                // 验证密码长度
                if (password.length < 6) {
                    errorElement.textContent = '密码长度至少为6位';
                    return;
                }
                
                // 验证密码一致性
                if (password !== confirmPassword) {
                    errorElement.textContent = '两次输入的密码不一致';
                    return;
                }
                
                // 从localStorage获取用户数据
                const users = JSON.parse(localStorage.getItem('users')) || [];
                
                // 检查邮箱是否已存在
                const existingUser = users.find(user => user.email === email);
                if (existingUser) {
                    errorElement.textContent = '邮箱已存在';
                    return;
                }
                
                // 创建新用户
                const newUser = {
                    id: 'user-' + Date.now(),
                    username: username,
                    email: email,
                    password: password,
                    role: 'user'
                };
                
                // 保存用户到localStorage
                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));
                
                // 生成模拟token
                const token = 'mock-token-' + Date.now();
                
                // 注册成功，保存token和用户信息
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(newUser));
                
                // 更新UI
                updateUserUI(newUser);
                
                // 关闭注册模态框
                document.body.removeChild(document.getElementById('register-container'));
                
                // 显示成功消息
                alert('注册成功！');
            } catch (error) {
                console.error('注册错误:', error);
                errorElement.textContent = '注册失败，请稍后重试';
            }
        }
        
        // 处理登出
        function handleLogout() {
            // 清除localStorage中的token和用户信息
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            
            // 更新UI
            updateUserUI(null);
            
            // 显示成功消息
            alert('登出成功！');
        }
        
        // 更新用户UI
        function updateUserUI(user) {
            const loginButtons = document.getElementById('login-buttons');
            const userMenu = document.getElementById('user-menu');
            const usernameDisplay = document.getElementById('username-display');
            
            if (user) {
                // 显示用户菜单
                loginButtons.style.display = 'none';
                userMenu.style.display = 'block';
                usernameDisplay.textContent = user.username;
            } else {
                // 显示登录注册按钮
                loginButtons.style.display = 'block';
                userMenu.style.display = 'none';
            }
        }
        
        // 检查用户登录状态
        function checkLoginStatus() {
            const userStr = localStorage.getItem('user');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    updateUserUI(user);
                } catch (error) {
                    console.error('解析用户信息失败:', error);
                    localStorage.removeItem('user');
                    localStorage.removeItem('token');
                }
            }
        }
        
        // 初始化下拉菜单功能
        function initDropdowns() {
            // 绑定所有下拉按钮的点击事件
            const dropdownButtons = document.querySelectorAll('.dropdown-toggle');
            dropdownButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const dropdownMenu = this.nextElementSibling;
                    if (dropdownMenu && dropdownMenu.classList.contains('dropdown-menu')) {
                        // 切换下拉菜单的显示状态
                        dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
                    }
                });
            });
            
            // 点击页面其他地方关闭下拉菜单
            document.addEventListener('click', function(event) {
                if (!event.target.closest('.dropdown')) {
                    const dropdownMenus = document.querySelectorAll('.dropdown-menu');
                    dropdownMenus.forEach(menu => {
                        menu.style.display = 'none';
                    });
                }
            });
        }
        
        // 初始化用户相关功能
        function initUserAuth() {
            // 检查登录状态
            checkLoginStatus();
            
            // 初始化下拉菜单
            initDropdowns();
            
            // 绑定登录按钮点击事件
            const loginButton = document.getElementById('login-button');
            if (loginButton) {
                loginButton.addEventListener('click', function() {
                    // 关闭下拉菜单
                    const dropdownMenu = this.closest('.dropdown-menu');
                    if (dropdownMenu) {
                        dropdownMenu.style.display = 'none';
                    }
                    showLoginModal();
                });
            }
            
            // 绑定注册按钮点击事件
            const registerButton = document.getElementById('register-button');
            if (registerButton) {
                registerButton.addEventListener('click', function() {
                    // 关闭下拉菜单
                    const dropdownMenu = this.closest('.dropdown-menu');
                    if (dropdownMenu) {
                        dropdownMenu.style.display = 'none';
                    }
                    showRegisterModal();
                });
            }
            
            // 绑定登出按钮点击事件
            const logoutButton = document.getElementById('logout-button');
            if (logoutButton) {
                logoutButton.addEventListener('click', function() {
                    // 关闭下拉菜单
                    const dropdownMenu = this.closest('.dropdown-menu');
                    if (dropdownMenu) {
                        dropdownMenu.style.display = 'none';
                    }
                    handleLogout();
                });
            }
        }
        
        // 初始化用户认证功能
        initUserAuth();
    }
    
    // 立即执行初始化函数
    initNavbar();
</script>
